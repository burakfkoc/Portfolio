<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burak Furkan Koç</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; }
    p.subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }
    .links { display: flex; flex-direction: column; gap: 0.75rem; }
    .links a {
      display: block;
      padding: 0.75rem 1rem;
      background: #334155;
      color: #e2e8f0;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.2s, transform 0.1s;
    }
    .links a:hover { background: #475569; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">YAKINDA</span>
    <h1>Burak Furkan Koç</h1>
    <p class="subtitle">Kişisel portfolyo ve projeler çok yakında burada.</p>
    <div class="links">
      <a href="https://linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:iletisim@burakfkoc.com">E-posta Gönder</a>
    </div>
  </div>
</body>
</html>
